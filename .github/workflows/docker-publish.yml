name: Docker Publish

# main 推送 → 更新 latest；推送 v* 标签 → 发布对应版本镜像。
# 需要先在仓库 Settings → Secrets and variables → Actions 配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Account Settings → Security →
#                       Personal access tokens，权限 Read & Write）
# secrets 未配置时本工作流跳过（显示 skipped 而非失败）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 发布串行化：新构建到来时取消进行中的旧构建，避免乱序覆盖
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    name: build & push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag 规则：v1.2.3 → 1.2.3；main 分支 → latest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cnlove2012/certbot-dns-dnspod
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test（拉取刚推送的镜像验证插件注册）
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Smoke testing: $IMAGE"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --help all 2>/dev/null | grep -A3 'dns-dnspod'
